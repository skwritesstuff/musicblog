backend:
  name: git-gateway
  branch: main
site_url: https://shameis.com
media_folder: public/uploads
public_folder: /uploads
collections:
- name: copy
  label: Site copy
  files:
  - name: siteCopy
    label: Labels, navigation and footer
    file: src/data/siteCopy.json
    fields:
