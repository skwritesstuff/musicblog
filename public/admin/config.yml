- name: posts
  label: Posts
  folder: src/content/posts
  create: true
  slug: '{{slug}}'
  fields:
  - name: title
    label: title
    widget: string
    required: true
  - name: artist
    label: artist
    widget: string
    required: false
  - name: date
    label: date
    widget: string
    required: true
  - name: category
    label: category
    widget: string
    required: true
  - name: audioUrl
    label: audioUrl
    widget: string
    required: false
  - name: artwork
    label: artwork
    widget: image
    required: false
  - name: excerpt
    label: excerpt
    widget: text
    required: false
  - name: legacyPath
    label: legacyPath
    widget: string
    required: false
  - name: body
    label: body
    widget: markdown
    required: true
  - name: sourceLinks
    label: Preserved source links
    widget: list
    required: false
    field:
      name: link
      label: Link
      widget: string
- name: pages
  label: Pages
  files:
  - name: story
    label: The Story
    file: src/content/pages/story.md
    fields:
    - name: title
      label: Title
      widget: string
    - name: body
      label: Body
      widget: markdown
