      name: brand
      widget: string
      required: false
    - label: title
      name: title
      widget: string
      required: false
    - label: utilityLinks
      name: utilityLinks
      widget: list
      fields:
      - label: label
        name: label
        widget: string
        required: false
      - label: href
        name: href
        widget: string
        required: false
